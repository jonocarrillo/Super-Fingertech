<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Time Clock</title>
<style>
  /* Black tablet kiosk theme — high contrast, large touch targets */
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --key: #222222;
    --key-active: #2e2e2e;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #9ca3af;
    --green: #22c55e;
    --green-dark: #16a34a;
    --danger: #f87171;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: #000;
    border-bottom: 1px solid var(--border);
    color: #fff;
  }
  .top h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .top-meta {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .top .clock {
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .top a {
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 32px;
  }

  .pad {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px 22px;
  }

  .pad h2 {
    margin: 0 0 6px;
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .pad .lead {
    margin: 0 0 16px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 18px;
  }
  .steps span {
    text-align: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #d1d5db;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 2px;
    line-height: 1.15;
  }

  .display {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 2.35rem;
    font-weight: 750;
    letter-spacing: 0.28em;
    font-variant-numeric: tabular-nums;
    color: #fff;
    padding: 14px 8px 14px 0.28em;
  }
  .display.placeholder {
    color: #4b5563;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    padding: 14px;
  }

  .error-msg {
    min-height: 18px;
    margin: 0 0 10px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--danger);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .keypad button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--key);
    color: #fff;
    border-radius: 14px;
    min-height: 64px;
    font-size: 1.5rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .keypad button:active {
    background: var(--key-active);
    transform: scale(0.97);
  }
  .keypad button.util {
    font-size: 0.85rem;
    font-weight: 650;
    color: var(--muted);
    background: transparent;
    border-color: transparent;
  }
  .keypad button.util.danger { color: var(--danger); }

  .submit {
    width: 100%;
    border: none;
    border-radius: 14px;
    min-height: 56px;
    font-size: 1.1rem;
    font-weight: 750;
    font-family: inherit;
    background: var(--green);
    color: #052e16;
    cursor: pointer;
  }
  .submit:active { background: var(--green-dark); }
  .submit:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: #374151;
    color: #9ca3af;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(10px);
    z-index: 50;
    max-width: min(440px, calc(100vw - 28px));
    background: #111;
    color: #fff;
    border: 1px solid #333;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
    opacity: 0;
    transition: .2s;
    pointer-events: none;
    box-shadow: 0 12px 32px rgba(0,0,0,.55);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #450a0a; border-color: #7f1d1d; color: #fecaca; }

  /* Tablet / landscape: slightly larger pad */
  @media (min-width: 700px) {
    .pad { width: min(460px, 100%); padding: 28px 26px 24px; }
    .keypad button { min-height: 72px; font-size: 1.65rem; }
    .display { min-height: 80px; font-size: 2.6rem; }
    .submit { min-height: 60px; font-size: 1.15rem; }
  }
  @media (max-width: 380px) {
    .keypad button { min-height: 54px; font-size: 1.25rem; }
    .steps span { font-size: 0.55rem; }
  }
</style>
</head>
<body>
  <header class="top">
    <h1>Time Clock</h1>
    <div class="top-meta">
      <div class="clock" id="clockTime"></div>
      <a href="/admin.html">Admin</a>
    </div>
  </header>

  <main>
    <div class="pad">
      <h2>Enter punch code</h2>
      <p class="lead">Your code is shown next to your name in Admin.</p>

      <div class="steps" aria-hidden="true">
        <span>1 In</span>
        <span>2 Lunch out</span>
        <span>3 Lunch in</span>
        <span>4 Out</span>
      </div>

      <div class="display placeholder" id="numberDisplay">••••</div>
      <div class="error-msg" id="padError"></div>

      <div class="keypad" id="keypad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="util danger" data-k="clear">Clear</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="util" data-k="back">⌫</button>
      </div>

      <button type="button" class="submit" id="submitBtn" disabled>Punch</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const display = $('numberDisplay');
  const padError = $('padError');
  const submitBtn = $('submitBtn');
  const MAX_LEN = 8;

  let number = '';
  let submitting = false;

  let audioCtx = null;
  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.12;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function playKeyTone() { beep(880, 0.06); }
  function playBackTone() { beep(440, 0.07); }
  function playSuccessTone() { beep(660, 0.09); setTimeout(() => beep(990, 0.12), 90); }
  function playErrorTone() { beep(220, 0.22, 'sawtooth'); }

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2800);
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function tickClock() {
    $('clockTime').textContent = new Date().toLocaleString([], {
      weekday: 'short', hour: 'numeric', minute: '2-digit', second: '2-digit'
    });
  }
  tickClock();
  setInterval(tickClock, 1000);

  function render() {
    if (number) {
      display.textContent = number;
      display.classList.remove('placeholder');
    } else {
      display.textContent = '••••';
      display.classList.add('placeholder');
    }
    submitBtn.disabled = !number || submitting;
  }

  function reset() {
    number = '';
    padError.textContent = '';
    render();
  }

  async function submit() {
    if (!number || submitting) return;
    submitting = true;
    render();
    try {
      const res = await fetch('/api/clock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeNumber: number })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        playErrorTone();
        padError.textContent = data.error || 'Could not punch';
        submitting = false;
        render();
        return;
      }
      playSuccessTone();
      reset();
      const label = data.label || (data.action || '').toUpperCase().replace('_', ' ');
      let msg = data.employeeName + ' — ' + label + ' @ ' + fmtTime(
        data.clockOut || data.lunchIn || data.lunchOut || data.clockIn
      );
      if (data.action === 'out' && data.hours != null) {
        msg += ' · ' + data.hours + ' hrs worked';
      } else if (data.action === 'lunch_out' && data.hours != null) {
        msg += ' · morning ' + data.hours + ' hrs';
      }
      toast(msg);
    } catch {
      playErrorTone();
      padError.textContent = 'Network error';
    }
    submitting = false;
    render();
  }

  $('keypad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const k = btn.dataset.k;
    padError.textContent = '';
    if (k === 'clear') { playBackTone(); reset(); return; }
    if (k === 'back') { playBackTone(); number = number.slice(0, -1); render(); return; }
    if (number.length >= MAX_LEN) return;
    playKeyTone();
    number += k;
    render();
  });

  submitBtn.addEventListener('click', submit);
  render();
})();
</script>
</body>
</html>
