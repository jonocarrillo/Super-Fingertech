<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Time Clock</title>
<style>
  /* Black tablet kiosk theme — high contrast, large touch targets */
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --key: #222222;
    --key-active: #2e2e2e;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #9ca3af;
    --green: #22c55e;
    --green-dark: #16a34a;
    --danger: #f87171;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: #000;
    border-bottom: 1px solid var(--border);
    color: #fff;
  }
  .top h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .top-meta {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .top .clock {
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .top a {
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 32px;
  }

  .pad {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px 22px;
  }

  .pad h2 {
    margin: 0 0 6px;
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .pad .lead {
    margin: 0 0 16px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 18px;
  }
  .steps span {
    text-align: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #d1d5db;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 2px;
    line-height: 1.15;
  }

  .display {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 2.35rem;
    font-weight: 750;
    letter-spacing: 0.28em;
    font-variant-numeric: tabular-nums;
    color: #fff;
    padding: 14px 8px 14px 0.28em;
  }
  .display.placeholder {
    color: #4b5563;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    padding: 14px;
  }

  .error-msg {
    min-height: 18px;
    margin: 0 0 10px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--danger);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .keypad button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--key);
    color: #fff;
    border-radius: 14px;
    min-height: 64px;
    font-size: 1.5rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .keypad button:active {
    background: var(--key-active);
    transform: scale(0.97);
  }
  .keypad button.util {
    font-size: 0.85rem;
    font-weight: 650;
    color: var(--muted);
    background: transparent;
    border-color: transparent;
  }
  .keypad button.util.danger { color: var(--danger); }

  .submit {
    width: 100%;
    border: none;
    border-radius: 14px;
    min-height: 56px;
    font-size: 1.1rem;
    font-weight: 750;
    font-family: inherit;
    background: var(--green);
    color: #052e16;
    cursor: pointer;
  }
  .submit:active { background: var(--green-dark); }
  .submit:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: #374151;
    color: #9ca3af;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(10px);
    z-index: 50;
    max-width: min(440px, calc(100vw - 28px));
    background: #111;
    color: #fff;
    border: 1px solid #333;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
    opacity: 0;
    transition: .2s;
    pointer-events: none;
    box-shadow: 0 12px 32px rgba(0,0,0,.55);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #450a0a; border-color: #7f1d1d; color: #fecaca; }

  /* Easter egg: flip whole kiosk UI upside down */
  body.egg-flip {
    transform: rotate(180deg);
    transform-origin: center center;
    transition: transform 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  body.egg-flip .toast {
    /* toast uses its own transform — keep readable while flipped */
    bottom: auto;
    top: 24px;
  }

  /* Confetti for Maximiliano only — full-screen canvas */
  #confetti-root {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    pointer-events: none !important;
    z-index: 99999 !important;
    overflow: hidden !important;
  }
  #confetti-root canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Tablet / landscape: slightly larger pad */
  @media (min-width: 700px) {
    .pad { width: min(460px, 100%); padding: 28px 26px 24px; }
    .keypad button { min-height: 72px; font-size: 1.65rem; }
    .display { min-height: 80px; font-size: 2.6rem; }
    .submit { min-height: 60px; font-size: 1.15rem; }
  }
  @media (max-width: 380px) {
    .keypad button { min-height: 54px; font-size: 1.25rem; }
    .steps span { font-size: 0.55rem; }
  }
</style>
</head>
<body>
  <header class="top">
    <h1>Time Clock</h1>
    <div class="top-meta">
      <div class="clock" id="clockTime"></div>
      <a href="/admin.html">Admin</a>
    </div>
  </header>

  <main>
    <div class="pad">
      <h2 id="padTitle">Enter punch code</h2>
      <p class="lead" id="padLead">Your code is shown next to your name in Admin.</p>
      <p class="lead" id="padWho" style="display:none;color:#86efac;font-weight:700;"></p>

      <div class="steps" aria-hidden="true">
        <span>1 In</span>
        <span>2 Lunch out</span>
        <span>3 Lunch in</span>
        <span>4 Out</span>
      </div>

      <div class="display placeholder" id="numberDisplay">••••</div>
      <div class="error-msg" id="padError"></div>

      <div class="keypad" id="keypad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="util danger" data-k="clear">Clear</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="util" data-k="back">⌫</button>
      </div>

      <button type="button" class="submit" id="submitBtn" disabled>Next</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <div id="confetti-root" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const display = $('numberDisplay');
  const padError = $('padError');
  const submitBtn = $('submitBtn');
  const MAX_CODE_LEN = 8;
  const MAX_PIN_LEN = 8;
  const MIN_PIN_LEN = 4;
  const EASTER_EGG_CODE = '43212346';

  // Flow: code → (setup_pin → setup_pin2) or pin → punch
  let step = 'code'; // code | setup_pin | setup_pin2 | pin
  let number = '';
  let pin = '';
  let pendingCode = '';
  let pendingName = '';
  let setupPinOnce = '';
  let submitting = false;
  let eggFlipped = false;

  let audioCtx = null;
  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.12;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function playKeyTone() { beep(880, 0.06); }
  function playBackTone() { beep(440, 0.07); }
  function playSuccessTone() { beep(660, 0.09); setTimeout(() => beep(990, 0.12), 90); }
  function playErrorTone() { beep(220, 0.22, 'sawtooth'); }

  // ---- Text-to-speech (automatic — no separate enable step) ----
  // Tablets often block speech after fetch unless speech was primed on a touch.
  // We prime silently on the first keypad tap; no UI for "enable sound".
  let ttsPrimed = false;
  let pendingSpeech = null;

  function pickVoice() {
    if (!window.speechSynthesis) return null;
    const voices = speechSynthesis.getVoices() || [];
    return (
      voices.find(v => /en-US/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name)) ||
      voices.find(v => /en-US/i.test(v.lang)) ||
      voices.find(v => /^en/i.test(v.lang)) ||
      voices[0] ||
      null
    );
  }

  function primeTTS() {
    if (!window.speechSynthesis || ttsPrimed) return;
    try {
      // Silent utterance during a real tap unlocks speech for the rest of the session
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.rate = 2;
      const voice = pickVoice();
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
      ttsPrimed = true;
    } catch (e) { /* ignore */ }
  }

  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    try {
      if (speechSynthesis.paused) speechSynthesis.resume();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const voice = pickVoice();
      if (voice) u.voice = voice;
      u.lang = (voice && voice.lang) || 'en-US';
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      // If cancelled mid-flight, Chrome sometimes needs a tick before speak
      setTimeout(function () {
        try {
          if (speechSynthesis.paused) speechSynthesis.resume();
          speechSynthesis.speak(u);
        } catch (e2) { /* ignore */ }
      }, 40);
    } catch (e) { /* ignore */ }
  }

  function speakPunch(data) {
    const name = (data.employeeName || 'Employee').trim();
    const phrases = {
      in: name + ', clocked in',
      lunch_out: name + ', lunch out',
      lunch_in: name + ', lunch in',
      out: name + ', clocked out'
    };
    let line = phrases[data.action] || (name + ', ' + (data.label || 'punched'));
    // e.g. "Jesus Polanco, clocked in. Late, 12 minutes."
    if (data.scheduleLabel) {
      line += '. ' + data.scheduleLabel.replace(/\(/g, '').replace(/\)/g, '');
    }
    pendingSpeech = line;
    setTimeout(function () {
      speak(pendingSpeech);
      pendingSpeech = null;
    }, 250);
  }

  if (window.speechSynthesis) {
    speechSynthesis.onvoiceschanged = function () {
      if (pendingSpeech) speak(pendingSpeech);
    };
  }

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2800);
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function tickClock() {
    $('clockTime').textContent = new Date().toLocaleString([], {
      weekday: 'short', hour: 'numeric', minute: '2-digit', second: '2-digit'
    });
  }
  tickClock();
  setInterval(tickClock, 1000);

  function currentValue() {
    return (step === 'code') ? number : pin;
  }

  function setStep(next) {
    step = next;
    pin = '';
    padError.textContent = '';
    const who = $('padWho');
    if (step === 'code') {
      $('padTitle').textContent = 'Enter punch code';
      $('padLead').textContent = 'Your code is shown next to your name in Admin.';
      who.style.display = 'none';
      submitBtn.textContent = 'Next';
      pendingCode = '';
      pendingName = '';
      setupPinOnce = '';
    } else if (step === 'setup_pin') {
      $('padTitle').textContent = 'Choose your PIN';
      $('padLead').textContent = '4–8 digits. You will use this every time you punch.';
      who.style.display = '';
      who.textContent = pendingName;
      submitBtn.textContent = 'Continue';
    } else if (step === 'setup_pin2') {
      $('padTitle').textContent = 'Confirm your PIN';
      $('padLead').textContent = 'Enter the same PIN again.';
      who.style.display = '';
      who.textContent = pendingName;
      submitBtn.textContent = 'Save PIN';
    } else if (step === 'pin') {
      $('padTitle').textContent = 'Enter your PIN';
      $('padLead').textContent = 'Your personal PIN — not the punch code.';
      who.style.display = '';
      who.textContent = pendingName;
      submitBtn.textContent = 'Punch';
    }
    render();
  }

  function render() {
    const val = currentValue();
    const isPinStep = step !== 'code';
    if (val) {
      display.textContent = isPinStep ? '•'.repeat(val.length) : val;
      display.classList.remove('placeholder');
    } else {
      display.textContent = isPinStep ? 'PIN' : '••••';
      display.classList.add('placeholder');
    }
    if (step === 'code') {
      submitBtn.disabled = !number || submitting;
    } else if (step === 'setup_pin' || step === 'setup_pin2') {
      submitBtn.disabled = pin.length < MIN_PIN_LEN || submitting;
    } else {
      submitBtn.disabled = pin.length < MIN_PIN_LEN || submitting;
    }
  }

  function resetAll() {
    number = '';
    pin = '';
    setStep('code');
  }

  function triggerEasterEgg() {
    eggFlipped = !eggFlipped;
    document.body.classList.toggle('egg-flip', eggFlipped);
    playSuccessTone();
    speak(eggFlipped ? 'Upside down mode' : 'Right side up');
    toast(eggFlipped ? '🙃 Upside down!' : '🙂 Right side up');
    resetAll();
  }

  /** Confetti only for Maximiliano Sanchez (name or emp #92). */
  function isMaximilianoSanchez(name, empNumber) {
    if (String(empNumber || '').trim() === '92') return true;
    if (!name) return false;
    const n = String(name)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    const hasMax = n.includes('maximiliano') || n.includes('maximilaino');
    const hasSanchez = n.includes('sanchez');
    return hasMax && hasSanchez;
  }

  /**
   * Real canvas confetti (previous deploy only removed CSS for div pieces
   * and never switched JS to canvas — pieces were invisible).
   */
  function shootConfetti() {
    const root = document.getElementById('confetti-root');
    if (!root) return;
    root.innerHTML = '';
    const canvas = document.createElement('canvas');
    root.appendChild(canvas);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 320);
    const h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 480);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999;';
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#22c55e', '#4ade80', '#fbbf24', '#f472b6', '#60a5fa', '#f87171', '#a78bfa', '#ffffff', '#facc15', '#fb923c'];
    const pieces = [];
    const count = 220;
    // Two bursts: top rain + center explosion
    for (let i = 0; i < count; i++) {
      const fromCenter = i < count * 0.45;
      const angle = Math.random() * Math.PI * 2;
      const speed = fromCenter ? (4 + Math.random() * 10) : (2 + Math.random() * 4);
      pieces.push({
        x: fromCenter ? w * 0.5 : Math.random() * w,
        y: fromCenter ? h * 0.35 : (-20 - Math.random() * h * 0.4),
        w: 10 + Math.random() * 14,
        h: 12 + Math.random() * 16,
        vx: fromCenter ? Math.cos(angle) * speed : (-4 + Math.random() * 8),
        vy: fromCenter ? Math.sin(angle) * speed - 2 : (3 + Math.random() * 6),
        rot: Math.random() * Math.PI,
        vr: -0.35 + Math.random() * 0.7,
        color: colors[i % colors.length],
        shape: i % 3 // 0 rect, 1 circle, 2 diamond
      });
    }

    const start = performance.now();
    const duration = 4500;
    function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, w, h);
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.vx *= 0.995;
        p.rot += p.vr;
        const fade = Math.max(0, 1 - (t / duration) * 0.85);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === 1) {
          ctx.beginPath();
          ctx.arc(0, 0, p.w * 0.45, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.shape === 2) {
          ctx.beginPath();
          ctx.moveTo(0, -p.h / 2);
          ctx.lineTo(p.w / 2, 0);
          ctx.lineTo(0, p.h / 2);
          ctx.lineTo(-p.w / 2, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }
      if (t < duration) {
        requestAnimationFrame(frame);
      } else {
        root.innerHTML = '';
      }
    }
    requestAnimationFrame(frame);
  }

  function maybeConfetti(name, empNumber) {
    try {
      if (isMaximilianoSanchez(name, empNumber)) shootConfetti();
    } catch (e) { /* never block punch on confetti */ }
  }

  async function lookupCode() {
    if (!number || submitting) return;
    if (number === EASTER_EGG_CODE) {
      triggerEasterEgg();
      return;
    }
    submitting = true;
    render();
    try {
      const res = await fetch('/api/kiosk/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeNumber: number })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        playErrorTone();
        padError.textContent = data.error || 'Code not found';
        submitting = false;
        render();
        return;
      }
      pendingCode = number;
      pendingName = data.employeeName || '';
      number = '';
      if (data.needsPinSetup || !data.hasPin) {
        setStep('setup_pin');
        speak(pendingName + ', choose a PIN');
        toast(pendingName + ' — choose a 4–8 digit PIN');
      } else {
        setStep('pin');
      }
    } catch {
      playErrorTone();
      padError.textContent = 'Network error';
    }
    submitting = false;
    render();
  }

  async function saveNewPin() {
    if (pin.length < MIN_PIN_LEN || submitting) return;
    if (step === 'setup_pin') {
      setupPinOnce = pin;
      pin = '';
      setStep('setup_pin2');
      return;
    }
    if (pin !== setupPinOnce) {
      playErrorTone();
      padError.textContent = 'PINs did not match — try again';
      setupPinOnce = '';
      pin = '';
      setStep('setup_pin');
      return;
    }
    submitting = true;
    render();
    try {
      const res = await fetch('/api/kiosk/set-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeNumber: pendingCode, pin: pin })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        playErrorTone();
        padError.textContent = data.error || 'Could not save PIN';
        submitting = false;
        render();
        return;
      }
      playSuccessTone();
      speak(pendingName + ', PIN saved');
      toast('PIN saved — enter it to punch');
      pin = '';
      setStep('pin');
    } catch {
      playErrorTone();
      padError.textContent = 'Network error';
    }
    submitting = false;
    render();
  }

  async function punch() {
    if (pin.length < MIN_PIN_LEN || submitting || !pendingCode) return;
    submitting = true;
    render();
    try {
      const res = await fetch('/api/clock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeNumber: pendingCode, pin: pin })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        playErrorTone();
        const errMsg = data.error || 'Could not punch';
        padError.textContent = errMsg;
        if (data.alreadyPunched || res.status === 409) {
          const who = (data.employeeName || pendingName || '').trim();
          speak(who ? (who + '. ' + errMsg) : errMsg);
          toast(who ? (who + ' — ' + errMsg) : errMsg, true);
          // Still celebrate Max even when already punched today
          maybeConfetti(who, data.employeeNumber || pendingCode);
        } else if (data.needsPinSetup) {
          setStep('setup_pin');
        }
        submitting = false;
        pin = '';
        render();
        return;
      }
      playSuccessTone();
      speakPunch(data);
      // Confetti ONLY for Maximiliano Sanchez (any successful punch)
      maybeConfetti(data.employeeName || pendingName, data.employeeNumber || pendingCode);
      const label = data.label || (data.action || '').toUpperCase().replace('_', ' ');
      let msg = data.employeeName + ' — ' + label + ' @ ' + fmtTime(
        data.clockOut || data.lunchIn || data.lunchOut || data.clockIn
      );
      if (data.scheduleLabel) msg += ' · ' + data.scheduleLabel;
      else if (data.scheduleNote) msg += ' · ' + data.scheduleNote;
      if (data.action === 'out' && data.hours != null) msg += ' · ' + data.hours + ' hrs worked';
      else if (data.action === 'lunch_out' && data.hours != null) msg += ' · morning ' + data.hours + ' hrs';
      toast(msg);
      resetAll();
    } catch {
      playErrorTone();
      padError.textContent = 'Network error';
    }
    submitting = false;
    render();
  }

  async function submit() {
    if (submitting) return;
    if (step === 'code') return lookupCode();
    if (step === 'setup_pin' || step === 'setup_pin2') return saveNewPin();
    if (step === 'pin') return punch();
  }

  $('keypad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    getAudioCtx();
    primeTTS();
    const k = btn.dataset.k;
    padError.textContent = '';
    if (k === 'clear') {
      playBackTone();
      if (step === 'code') {
        number = '';
      } else if (step === 'setup_pin' || step === 'setup_pin2' || step === 'pin') {
        // Clear clears PIN; double-clear / long path: back to code
        if (!pin) {
          resetAll();
          return;
        }
        pin = '';
      }
      render();
      return;
    }
    if (k === 'back') {
      playBackTone();
      if (step === 'code') number = number.slice(0, -1);
      else pin = pin.slice(0, -1);
      render();
      return;
    }
    const maxLen = step === 'code' ? MAX_CODE_LEN : MAX_PIN_LEN;
    if (currentValue().length >= maxLen) return;
    playKeyTone();
    if (step === 'code') {
      number += k;
      render();
      if (number === EASTER_EGG_CODE) setTimeout(triggerEasterEgg, 80);
    } else {
      pin += k;
      render();
    }
  });

  submitBtn.addEventListener('click', function () {
    getAudioCtx();
    primeTTS();
    submit();
  });
  setStep('code');
})();
</script>
</body>
</html>
