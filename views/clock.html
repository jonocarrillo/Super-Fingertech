<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clock In / Out</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #273449; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --green: #22c55e; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 22px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header .clock { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header a { color: var(--muted); font-size: 12px; text-decoration: none; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .pad-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 28px; width: 100%; max-width: 340px; text-align: center;
  }
  .pad-card h2 { margin: 0 0 4px; font-size: 17px; }
  .pad-card .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .number-display {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; font-size: 30px; font-weight: 700;
    letter-spacing: 6px; min-height: 44px; font-variant-numeric: tabular-nums;
  }
  .number-display.placeholder { color: var(--muted); font-weight: 400; font-size: 16px; letter-spacing: normal; }
  .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .keypad button {
    padding: 20px 0; font-size: 22px; font-weight: 700; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  .keypad button:active { transform: scale(.95); }
  .keypad button.clear { background: transparent; border-color: transparent; color: var(--danger); font-size: 14px; }
  .keypad button.back { background: transparent; border-color: transparent; color: var(--muted); font-size: 14px; }
  .submit-btn {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border-radius: 12px;
    border: none; background: var(--green); color: #052e16; cursor: pointer;
  }
  .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: var(--green); color: #052e16; padding: 14px 22px; border-radius: 12px;
    font-weight: 700; font-size: 16px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50;
    text-align: center; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>🕒 Time Clock</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="clock" id="clockTime"></div>
    <a href="/admin.html">Admin</a>
  </div>
</header>

<main>
  <div class="pad-card">
    <h2>Enter your employee number</h2>
    <p class="sub">Each day: <strong>In</strong> → <strong>Lunch out</strong> → <strong>Lunch in</strong> → <strong>Out</strong></p>
    <div class="number-display placeholder" id="numberDisplay">— — — —</div>
    <div class="error-msg" id="padError"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="clear" data-k="clear">Clear</button>
      <button data-k="0">0</button>
      <button class="back" data-k="back">⌫</button>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>Punch</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const display = $('numberDisplay');
  const padError = $('padError');
  const submitBtn = $('submitBtn');
  const MAX_LEN = 8;

  let number = '';
  let submitting = false;

  // ---- Key press sounds (synthesized, no audio files needed) ----
  let audioCtx = null;
  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function playKeyTone() { beep(880, 0.06); }
  function playBackTone() { beep(440, 0.07); }
  function playSuccessTone() { beep(660, 0.09); setTimeout(() => beep(990, 0.12), 90); }
  function playErrorTone() { beep(220, 0.22, 'sawtooth'); }

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2800);
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function tickClock() {
    $('clockTime').textContent = new Date().toLocaleString([], {
      weekday: 'short', hour: 'numeric', minute: '2-digit', second: '2-digit'
    });
  }
  tickClock();
  setInterval(tickClock, 1000);

  function render() {
    display.textContent = number || '— — — —';
    display.classList.toggle('placeholder', !number);
    submitBtn.disabled = !number || submitting;
  }

  function reset() {
    number = '';
    padError.textContent = '';
    render();
  }

  async function submit() {
    if (!number || submitting) return;
    submitting = true;
    render();
    try {
      const res = await fetch('/api/clock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeNumber: number })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        playErrorTone();
        padError.textContent = data.error || 'Could not clock in/out';
        submitting = false;
        render();
        return;
      }
      playSuccessTone();
      reset();
      const label = data.label || (data.action || '').toUpperCase().replace('_', ' ');
      let msg = data.employeeName + ' — ' + label + ' @ ' + fmtTime(
        data.clockOut || data.lunchIn || data.lunchOut || data.clockIn
      );
      if (data.action === 'out' && data.hours != null) {
        msg += ' · ' + data.hours + ' hrs worked';
      } else if (data.action === 'lunch_out' && data.hours != null) {
        msg += ' · morning ' + data.hours + ' hrs';
      }
      toast(msg);
    } catch {
      playErrorTone();
      padError.textContent = 'Network error';
    }
    submitting = false;
    render();
  }

  $('keypad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const k = btn.dataset.k;
    padError.textContent = '';
    if (k === 'clear') { playBackTone(); reset(); return; }
    if (k === 'back') { playBackTone(); number = number.slice(0, -1); render(); return; }
    if (number.length >= MAX_LEN) return;
    playKeyTone();
    number += k;
    render();
  });

  submitBtn.addEventListener('click', submit);

  render();
})();
</script>
</body>
</html>
