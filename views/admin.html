<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>🕒 Employee Clock — Admin</h1>
  <nav>
    <a href="/clock.html">Kiosk</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<main>
  <section class="card card-employees">
    <h2>Employees</h2>
    <p class="hint">Add by <strong>name only</strong>. Punch code is assigned automatically.</p>
    <div id="employeeTableWrap">
      <table class="data">
        <thead><tr><th>Employee</th><th>Status</th><th>Added</th><th></th></tr></thead>
        <tbody id="employeeBody"></tbody>
      </table>
    </div>
    <div class="grid">
      <div class="field"><label>Name</label><input id="newName" placeholder="Full name"></div>
      <div class="field"><label>&nbsp;</label><button class="btn green" id="addEmployeeBtn">Add</button></div>
    </div>
  </section>

  <section class="card card-reports">
    <h2>Reports <span class="muted">(daily / biweekly)</span></h2>
    <div class="filters">
      <div class="field"><label>Report</label>
        <select id="reportType">
          <option value="daily">Daily attendance</option>
          <option value="biweekly">Biweekly summary</option>
        </select>
      </div>
      <div class="field" id="reportDateField"><label id="reportDateLabel">Date</label>
        <input id="reportDate" type="date">
      </div>
      <div class="field"><label>Employee</label>
        <select id="reportEmployee"><option value="">All</option></select>
      </div>
      <button class="btn" id="reportRunBtn">Run</button>
      <button class="btn secondary" id="reportExportBtn">Export CSV</button>
      <button class="btn secondary" id="reportExportDetailBtn" style="display:none;">CSV + totals</button>
    </div>
    <p class="muted hint" id="reportMeta"></p>
    <div id="reportSummary"></div>
    <div id="reportTableWrap">
      <table class="data" id="reportTable">
        <thead id="reportHead"></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card card-entries">
    <h2>Time entries <span class="muted">(edit punches)</span></h2>
    <div class="filters">
      <div class="field"><label>Employee</label>
        <select id="filterEmployee"><option value="">All</option></select>
      </div>
      <div class="field"><label>From</label><input id="filterFrom" type="date"></div>
      <div class="field"><label>To</label><input id="filterTo" type="date"></div>
      <button class="btn" id="filterBtn">Filter</button>
      <button class="btn secondary" id="exportBtn">Export CSV</button>
    </div>
    <div id="summaryWrap"></div>
    <div id="entriesTableWrap">
      <table class="data">
        <thead><tr>
          <th>Employee</th>
          <th>In</th>
          <th>Lunch out</th>
          <th>Lunch in</th>
          <th>Out</th>
          <th>Hours</th>
          <th>Note</th>
          <th></th>
        </tr></thead>
        <tbody id="entriesBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2600);
  }
  function fmtDT(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function toLocalInputValue(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  let employees = [];

  async function api(url, opts) {
    const res = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts || {}));
    if (res.status === 401) {
      location.href = '/login.html?next=' + encodeURIComponent(location.pathname || '/admin.html');
      throw new Error('login required');
    }
    return res;
  }

  async function loadEmployees() {
    const res = await api('/api/admin/employees');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { toast(data.error || 'Failed to load employees', true); return; }
    employees = data.employees || [];
    renderEmployeeTable();
    renderEmployeeFilter();
  }

  function employeeLabel(e) {
    const num = e.employeeNumber != null ? e.employeeNumber : e;
    const name = e.name != null ? e.name : '';
    if (name && num) return esc(name) + ' <span class="muted">#' + esc(num) + '</span>';
    return esc(name || num || '');
  }

  function renderEmployeeTable() {
    $('employeeBody').innerHTML = employees.map(e => {
      const badge = e.active ? '<span class="badge in">Active</span>' : '<span class="badge out">Inactive</span>';
      return '<tr>' +
        '<td>' + employeeLabel(e) + '</td>' +
        '<td>' + badge + '</td>' +
        '<td class="muted">' + esc(fmtDT(e.createdAt)) + '</td>' +
        '<td class="row-actions">' +
          '<button class="btn small ' + (e.active ? 'danger' : 'green') + '" data-act="toggle" data-id="' + e.id + '">' + (e.active ? 'Deactivate' : 'Reactivate') + '</button>' +
        '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="muted">No employees yet.</td></tr>';

    $('employeeBody').querySelectorAll('button[data-act="toggle"]').forEach(btn => {
      btn.onclick = async () => {
        const emp = employees.find(e => e.id === Number(btn.dataset.id));
        await api('/api/admin/employees/' + btn.dataset.id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active: !emp.active })
        });
        loadEmployees();
      };
    });
  }

  function renderEmployeeFilter() {
    const opts = '<option value="">All</option>' +
      employees.map(e => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('');
    ['filterEmployee', 'reportEmployee'].forEach(id => {
      const sel = $(id);
      if (!sel) return;
      const current = sel.value;
      sel.innerHTML = opts;
      sel.value = current;
    });
  }

  // ---- Reports (TCMS-style daily / biweekly) ----
  function todayISO() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function syncReportControls() {
    const type = $('reportType').value;
    const detailBtn = $('reportExportDetailBtn');
    if (type === 'biweekly') {
      $('reportDateLabel').textContent = 'Period end (14 days back)';
      detailBtn.style.display = '';
      detailBtn.textContent = 'Export CSV + totals';
    } else {
      $('reportDateLabel').textContent = 'Date';
      detailBtn.style.display = 'none';
    }
  }

  /** Shared columns for daily + biweekly (In / Lunch out / Lunch in / Out). */
  function renderPunchRows(rows) {
    $('reportHead').innerHTML =
      '<tr><th>Date</th><th>Employee</th><th>In</th><th>Lunch out</th><th>Lunch in</th><th>Out</th><th>Hours</th><th>Status</th></tr>';
    $('reportBody').innerHTML = (rows || []).map(r =>
      '<tr>' +
        '<td>' + esc(r.date) + '</td>' +
        '<td>' + esc(r.employeeName) + (r.employeeNumber ? ' <span class="muted">#' + esc(r.employeeNumber) + '</span>' : '') + '</td>' +
        '<td>' + esc(r.clockInLocal) + '</td>' +
        '<td>' + esc(r.lunchOutLocal) + '</td>' +
        '<td>' + esc(r.lunchInLocal) + '</td>' +
        '<td>' + esc(r.clockOutLocal) + '</td>' +
        '<td>' + (r.hours != null ? r.hours : '—') + '</td>' +
        '<td>' + esc(r.status) + '</td>' +
      '</tr>'
    ).join('') || '<tr><td colspan="8" class="muted">No punches in this range.</td></tr>';
  }

  async function runReport() {
    const type = $('reportType').value;
    const day = $('reportDate').value || todayISO();
    const emp = $('reportEmployee').value;
    let url;
    if (type === 'daily') {
      url = '/api/admin/reports/daily?date=' + encodeURIComponent(day);
    } else {
      url = '/api/admin/reports/biweekly?periodEnd=' + encodeURIComponent(day);
    }
    if (emp) url += '&employeeId=' + encodeURIComponent(emp);
    const res = await api(url);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { toast(data.error || 'Report failed', true); return; }
    renderReport(data);
  }

  function renderReport(data) {
    const meta = $('reportMeta');
    const head = $('reportHead');
    const body = $('reportBody');
    const sum = $('reportSummary');

    if (data.report === 'daily') {
      meta.textContent = data.title + ' · ' + data.date + ' · ' + (data.timezone || '') +
        ' · ' + data.rowCount + ' row(s) · ' + data.totalHours + ' total hrs' +
        (data.incompleteCount ? ' · ' + data.incompleteCount + ' incomplete' : '');
      sum.innerHTML = '';
      renderPunchRows(data.rows);
      return;
    }

    if (data.report === 'biweekly') {
      meta.textContent = data.title + ' · ' + data.periodStart + ' → ' + data.periodEnd +
        ' · ' + (data.timezone || '') + ' · ' + (data.rowCount || 0) + ' day-row(s) · ' +
        (data.employeeCount || 0) + ' employee(s) · ' + data.totalHours + ' total hrs' +
        (data.incompleteCount ? ' · ' + data.incompleteCount + ' incomplete' : '');
      // Totals strip (still punch grid below — same columns as daily)
      const totals = data.totals || [];
      if (totals.length) {
        sum.innerHTML = '<table class="data"><thead><tr><th>Employee</th><th>Days</th><th>Complete</th><th>Incomplete</th><th>Total hours</th></tr></thead><tbody>' +
          totals.map(t =>
            '<tr><td>' + esc(t.employeeName) + (t.employeeNumber ? ' <span class="muted">#' + esc(t.employeeNumber) + '</span>' : '') +
            '</td><td>' + t.daysWorked + '</td><td>' + t.completeDays + '</td><td>' + t.incompleteDays +
            '</td><td><strong>' + t.hours + '</strong></td></tr>'
          ).join('') +
          '</tbody></table><p class="muted" style="margin-top:10px;">Day-by-day punches (same columns as daily):</p>';
      } else {
        sum.innerHTML = '';
      }
      renderPunchRows(data.rows);
    }
  }

  function reportExportUrl(kind) {
    const type = $('reportType').value;
    const day = $('reportDate').value || todayISO();
    const emp = $('reportEmployee').value;
    let url;
    if (type === 'daily') {
      url = '/api/admin/reports/daily.csv?date=' + encodeURIComponent(day);
    } else if (kind === 'detail') {
      url = '/api/admin/reports/biweekly-detail.csv?periodEnd=' + encodeURIComponent(day);
    } else {
      url = '/api/admin/reports/biweekly.csv?periodEnd=' + encodeURIComponent(day);
    }
    if (emp) url += '&employeeId=' + encodeURIComponent(emp);
    return url;
  }

  $('reportType').onchange = syncReportControls;
  $('reportRunBtn').onclick = () => runReport().catch(err => toast(String(err.message || err), true));
  $('reportExportBtn').onclick = () => { window.location = reportExportUrl('summary'); };
  $('reportExportDetailBtn').onclick = () => { window.location = reportExportUrl('detail'); };
  $('reportDate').value = todayISO();
  syncReportControls();


  $('addEmployeeBtn').onclick = async () => {
    const name = $('newName').value.trim();
    if (!name) { toast('Name required', true); return; }
    const res = await api('/api/admin/employees', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { toast(data.error || 'Failed to add employee', true); return; }
    $('newName').value = '';
    const code = data.employeeNumber ? ' — punch code #' + data.employeeNumber : '';
    toast('Added ' + (data.name || name) + code);
    loadEmployees();
  };

  function entriesQuery() {
    const params = new URLSearchParams();
    if ($('filterEmployee').value) params.set('employeeId', $('filterEmployee').value);
    if ($('filterFrom').value) params.set('from', $('filterFrom').value);
    if ($('filterTo').value) params.set('to', $('filterTo').value + 'T23:59:59');
    return params.toString();
  }

  async function loadEntries() {
    const res = await api('/api/admin/entries?' + entriesQuery());
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { toast(data.error || 'Failed to load entries', true); return; }
    renderSummary(data.summary || []);
    renderEntries(data.entries || []);
  }

  function renderSummary(summary) {
    if (!summary.length) { $('summaryWrap').innerHTML = '<p class="muted">No completed shifts in range.</p>'; return; }
    $('summaryWrap').innerHTML = '<table class="data"><thead><tr><th>Employee</th><th>Shifts</th><th>Total hours</th></tr></thead><tbody>' +
      summary.map(s => '<tr><td>' + esc(s.employeeName) + '</td><td>' + s.shifts + '</td><td>' + s.hours + '</td></tr>').join('') +
      '</tbody></table>';
  }

  function statusBadge(e) {
    if (e.clockOut) return '<span class="badge out">Done</span>';
    if (e.lunchOut && !e.lunchIn) return '<span class="badge in">At lunch</span>';
    if (e.lunchIn && !e.clockOut) return '<span class="badge in">After lunch</span>';
    if (e.clockIn) return '<span class="badge in">Working</span>';
    return '';
  }

  function renderEntries(entries) {
    $('entriesBody').innerHTML = entries.map(e => {
      return '<tr data-id="' + e.id + '">' +
        '<td>' + esc(e.employeeName) + ' ' + statusBadge(e) + '</td>' +
        '<td><input type="datetime-local" class="ci" value="' + toLocalInputValue(e.clockIn) + '" style="min-width:160px"></td>' +
        '<td><input type="datetime-local" class="lo" value="' + toLocalInputValue(e.lunchOut) + '" style="min-width:160px"></td>' +
        '<td><input type="datetime-local" class="li" value="' + toLocalInputValue(e.lunchIn) + '" style="min-width:160px"></td>' +
        '<td><input type="datetime-local" class="co" value="' + toLocalInputValue(e.clockOut) + '" style="min-width:160px"></td>' +
        '<td>' + (e.hours != null ? e.hours : '—') + '</td>' +
        '<td><input type="text" class="note" value="' + esc(e.note || '') + '" placeholder="note" style="min-width:100px"></td>' +
        '<td class="row-actions">' +
          '<button class="btn small secondary" data-act="save">Save</button>' +
          '<button class="btn small danger" data-act="delete">Delete</button>' +
        '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="muted">No entries in range.</td></tr>';

    $('entriesBody').querySelectorAll('tr[data-id]').forEach(row => {
      const id = row.dataset.id;
      row.querySelector('[data-act="save"]').onclick = async () => {
        const val = (sel) => {
          const v = row.querySelector(sel).value;
          return v ? new Date(v).toISOString() : null;
        };
        const note = row.querySelector('.note').value;
        const res = await api('/api/admin/entries/' + id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            clockIn: val('.ci'),
            lunchOut: val('.lo'),
            lunchIn: val('.li'),
            clockOut: val('.co'),
            note
          })
        });
        if (res.ok) { toast('Entry updated'); loadEntries(); } else { toast('Save failed', true); }
      };
      row.querySelector('[data-act="delete"]').onclick = async () => {
        if (!confirm('Delete this entry?')) return;
        const res = await api('/api/admin/entries/' + id, { method: 'DELETE' });
        if (res.ok) { toast('Entry deleted'); loadEntries(); } else { toast('Delete failed', true); }
      };
    });
  }

  $('filterBtn').onclick = loadEntries;
  $('exportBtn').onclick = () => { window.location = '/api/admin/export.csv?' + entriesQuery(); };
  $('logoutBtn').onclick = async (e) => {
    e.preventDefault();
    await api('/api/logout', { method: 'POST' }).catch(() => null);
    location.href = '/login.html?next=/admin.html';
  };

  loadEmployees()
    .then(loadEntries)
    .then(runReport)
    .catch(() => {});
})();
</script>
</body>
</html>
