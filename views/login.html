<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Clock Admin</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #273449; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--bg) 55%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label {
    display: block; font-size: 12px; color: var(--muted); font-weight: 600;
    margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .btn {
    width: 100%; margin-top: 18px; border: none; border-radius: 10px;
    padding: 12px 16px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #05263a; cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .error {
    display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
    color: #fecaca; font-size: 13px; font-weight: 600;
  }
  .error.show { display: block; }
  .hint { margin-top: 14px; color: var(--muted); font-size: 12px; text-align: center; }
  .hint a { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Clock Admin</h1>
    <p class="sub">Sign in to manage employees and hours.</p>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" value="admin">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>

      <button class="btn" type="submit" id="btn">Sign in</button>
      <div class="error" id="error"></div>
    </form>
    <p class="hint"><a href="/clock.html">&larr; Back to clock terminal</a></p>
  </div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const nextRaw = params.get('next') || '/admin.html';
  function safeNext(path) {
    if (!path || path[0] !== '/' || path.startsWith('//') || path.startsWith('/login')) return '/admin.html';
    return path;
  }
  const next = safeNext(nextRaw);

  fetch('/api/auth/status', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.enabled || d.authenticated) location.replace(next);
    })
    .catch(function () {});

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const err = document.getElementById('error');
    const btn = document.getElementById('btn');
    err.classList.remove('show');
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim() || 'admin',
          password: document.getElementById('password').value
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        err.textContent = data.error || 'Invalid username or password';
        err.classList.add('show');
        btn.disabled = false;
        return;
      }
      location.replace(next);
    } catch {
      err.textContent = 'Network error — is the server running?';
      err.classList.add('show');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
