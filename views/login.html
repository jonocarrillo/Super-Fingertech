<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Clock Admin</title>
<style>
  :root {
    --green: #16a34a;
    --green-deep: #14532d;
    --green-soft: #e8f5ec;
    --border: #d8e8dc;
    --text: #1a2e22;
    --muted: #6b7f72;
    --danger: #dc2626;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: #f7faf8;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .shell {
    width: min(400px, 100%);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,83,45,.04), 0 16px 40px rgba(20,83,45,.08);
  }
  .brand {
    background: var(--green-deep);
    color: #fff;
    padding: 22px 24px 18px;
  }
  .brand h1 {
    margin: 0 0 4px;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.88;
  }
  .body { padding: 22px 24px 20px; }
  label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  label + input { margin-bottom: 14px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
  }
  input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(22,163,74,.15);
  }
  .btn {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    background: var(--green);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #15803d; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .error {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .error.show { display: block; }
  .footer {
    margin-top: 16px;
    text-align: center;
    font-size: 0.85rem;
  }
  .footer a {
    color: var(--green);
    font-weight: 650;
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <h1>Clock Admin</h1>
      <p>Sign in to manage employees, punches, and reports.</p>
    </div>
    <div class="body">
      <form id="form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" value="admin">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>

        <button class="btn" type="submit" id="btn">Sign in</button>
        <div class="error" id="error"></div>
      </form>
      <p class="footer"><a href="/clock.html">← Back to time clock</a></p>
    </div>
  </div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const nextRaw = params.get('next') || '/admin.html';
  function safeNext(path) {
    if (!path || path[0] !== '/' || path.startsWith('//') || path.startsWith('/login')) return '/admin.html';
    return path;
  }
  const next = safeNext(nextRaw);

  fetch('/api/auth/status', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.enabled || d.authenticated) location.replace(next);
    })
    .catch(function () {});

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const err = document.getElementById('error');
    const btn = document.getElementById('btn');
    err.classList.remove('show');
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim() || 'admin',
          password: document.getElementById('password').value
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        err.textContent = data.error || 'Invalid username or password';
        err.classList.add('show');
        btn.disabled = false;
        return;
      }
      location.replace(next);
    } catch {
      err.textContent = 'Network error — is the server running?';
      err.classList.add('show');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
